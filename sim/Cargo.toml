[package]
name = "apoleia-sim"
version = "0.1.0"
edition = "2021"
description = "Kit 2 headless simulation prototype: population subsystem 1"
publish = false

[dependencies]
bevy_ecs = { version = "0.20", features = ["multi_threaded"] }
bevy_tasks = { version = "0.20", features = ["multi_threaded"] }
bevy_utils = { version = "0.20", features = ["parallel"] }
rustc-hash = "2"
xxhash-rust = { version = "0.8", features = ["xxh3"] }
zstd = { version = "0.13", features = ["zstdmt"] }

[workspace]
members = [".", "godot"]

[profile.release]
debug = false

[dev-dependencies]
bevy_ecs = { version = "0.20", features = ["multi_threaded", "debug"] }
proptest = "1"

